qwen3-4b:
  model: local/qwen3-4b
  api_key_env: LOCAL_QWEN_API_KEY
  api_base_url: http://127.0.0.1:8011/v1
  harness:
    name: terminus-2
    version: 4641fd590f190411c57e1cbd824a9f6786cbe92e
    options:
      mcp_usage_hint: true
  extra_body:
    response_format:
      type: json_schema
      json_schema:
        name: terminus_response
        schema:
          type: object
          additionalProperties: false
          properties:
            analysis:
              type: string
            plan:
              type: string
            commands:
              type: array
              items:
                type: object
                additionalProperties: false
                properties:
                  keystrokes:
                    type: string
                  duration:
                    type: number
                required:
                - keystrokes
                - duration
            task_complete:
              type: boolean
            view_images:
              type: array
              items:
                type: string
          required:
          - analysis
          - plan
          - commands
          - task_complete
gpt-5.6-luna:
  model: openrouter/openai/gpt-5.6-luna
  api_key_env: OPENROUTER_API_KEY
  api_base_url: https://openrouter.ai/api/v1
  generation_config:
    reasoning_effort: high
  harness:
    name: codex
    version: 0.154.0
gpt-6-sol:
  model: openrouter/openai/gpt-6-sol
  api_key_env: OPENROUTER_API_KEY
  api_base_url: https://openrouter.ai/api/v1
  generation_config:
    reasoning_effort: high
  harness:
    name: codex
    version: 0.156.1
    options:
      reasoning_summary: detailed
