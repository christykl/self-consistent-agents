# ---- OpenRouter routes (self-consistent-agents project) ----------------------
# One credential (OPENROUTER_API_KEY) for agents and judges. Codex reaches
# OpenRouter through the `base_url:` provider-block path (core/agents/codex.py),
# which keeps the `openai/` prefix OpenRouter routes on.
gpt-6-astra-openrouter:
  model: openai/gpt-6-astra
  api_key_env: OPENROUTER_API_KEY
  base_url: https://openrouter.ai/api/v1
  generation_config:
    reasoning_effort: high
  harness:
    name: codex
    version: 0.154.0
    options:
      reasoning_summary: detailed

# GPT-6.1 Sol as an agent, same harness and settings as gpt-6-astra-openrouter.
gpt-6.1-sol-openrouter:
  model: openai/gpt-6.1-sol
  api_key_env: OPENROUTER_API_KEY
  base_url: https://openrouter.ai/api/v1
  generation_config:
    reasoning_effort: high
  harness:
    name: codex
    version: 0.154.0
    options:
      reasoning_summary: detailed

# GPT-5 as an agent, same harness and settings as gpt-6-astra-openrouter.
gpt-5-openrouter:
  model: openai/gpt-5
  api_key_env: OPENROUTER_API_KEY
  base_url: https://openrouter.ai/api/v1
  generation_config:
    reasoning_effort: high
  harness:
    name: codex
    version: 0.154.0
    options:
      reasoning_summary: detailed

# Gemini 4 Argon as an agent, in Gemini CLI, on Vertex AI (GCP billing).
# VERTEX_SERVICE_ACCOUNT holds a service-account EMAIL; the host mints 1-hour
# tokens for it from ADC and refreshes them in the sandbox (Modal only). See
# docs/gemini_vertex.md. The `vertex` route is the native relay (Google bodies
# unchanged) pointed at Vertex AI paths. The bare `gemini-4-argon` 404s on
# Vertex; only the versioned `@default` name serves.
gemini-4-argon-vertex:
  model: gemini-4-argon@default
  api_key_env: VERTEX_SERVICE_ACCOUNT
  generation_config:
    reasoning_effort: high
  harness:
    name: gemini-cli
    version: 0.59.0
    options:
      route: vertex

# Gemini 3.8 Flash: same harness and route as gemini-4-argon-vertex, a smaller
# and faster model (a direct call answers in ~3 s vs ~1 min for Argon).
gemini-3.8-flash-vertex:
  model: gemini-3.8-flash@default
  api_key_env: VERTEX_SERVICE_ACCOUNT
  generation_config:
    reasoning_effort: high
  harness:
    name: gemini-cli
    version: 0.59.0
    options:
      route: vertex

# Judge: the CheatBench default judge (gpt-6-sol), through OpenRouter.
gpt-6-sol-openrouter:
  model: openrouter/openai/gpt-6-sol
  api_key_env: OPENROUTER_API_KEY
  generation_config:
    reasoning_effort: high

# Qwen3.8-27B (thinking on) through OpenRouter, in Terminus-2 (Harbor). Pinned
# to Alibaba (first party; OpenRouter lists its precision as "unknown"), with
# only Parasail/CoreWeave (fp8) as fallbacks. NOT bf16.
# DeepInfra (bf16) was tried first and was rate-limited upstream (429s killed
# the smoke episode; a 2-token request took 40 s).
# `reasoning.enabled` turns thinking on; LiteLLM returns it as reasoning_content.
# mcp_usage_hint lists the grader's MCP tools and a curl example in the prompt
# (Terminus-2 otherwise only gives the URL; see notes/qwen3-4b-cheatbench).
qwen3.8-27b-openrouter:
  model: openrouter/qwen/qwen3.8-27b
  api_key_env: OPENROUTER_API_KEY
  api_base_url: https://openrouter.ai/api/v1
  extra_body:
    reasoning:
      enabled: true
    provider:
      order:
      - alibaba
      - parasail
      - coreweave
      allow_fallbacks: false
  harness:
    name: terminus-2
    version: "4641fd590f190411c57e1cbd824a9f6786cbe92e"
    options:
      mcp_usage_hint: true
